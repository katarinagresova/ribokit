<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#263238">
<rect width="780" height="230" fill="white"/>

<!-- legend -->
<rect x="60" y="14" width="14" height="10" fill="#2a9d8f" rx="1"/>
<text x="80" y="23" font-size="11" fill="#546e7a">frame 0 (this ORF's)</text>
<rect x="230" y="14" width="14" height="10" fill="#9aa5b1" rx="1"/>
<text x="250" y="23" font-size="11" fill="#546e7a">frame 1 / frame 2</text>

<!-- host CDS shading behind the last codon -->
<rect x="650" y="40" width="60" height="120" fill="#4c78a8" opacity="0.12"/>
<text x="680" y="34" text-anchor="middle" font-size="10.5" fill="#78909c">inside the host CDS</text>

<line x1="60" y1="160" x2="720" y2="160" stroke="#b0bec5" stroke-width="1"/>

<!-- codon A: lead -->
<rect x="56" y="82" width="14" height="78" fill="#2a9d8f"/>
<rect x="73" y="147" width="14" height="13" fill="#9aa5b1"/>
<rect x="90" y="147" width="14" height="13" fill="#9aa5b1"/>
<text x="80" y="68" text-anchor="middle" font-size="13" fill="#2a9d8f">✓</text>
<text x="80" y="178" text-anchor="middle" font-size="11" fill="#78909c">1</text>

<!-- codon B: lead -->
<rect x="156" y="108" width="14" height="52" fill="#2a9d8f"/>
<rect x="173" y="160" width="14" height="0" fill="#9aa5b1"/>
<rect x="190" y="147" width="14" height="13" fill="#9aa5b1"/>
<text x="180" y="94" text-anchor="middle" font-size="13" fill="#2a9d8f">✓</text>
<text x="180" y="178" text-anchor="middle" font-size="11" fill="#78909c">2</text>

<!-- codon C: no reads, doesn't vote -->
<rect x="256" y="147" width="14" height="13" fill="none" stroke="#cfd8dc" stroke-dasharray="2,2"/>
<rect x="273" y="147" width="14" height="13" fill="none" stroke="#cfd8dc" stroke-dasharray="2,2"/>
<rect x="290" y="147" width="14" height="13" fill="none" stroke="#cfd8dc" stroke-dasharray="2,2"/>
<text x="280" y="178" text-anchor="middle" font-size="11" fill="#78909c">3</text>
<text x="280" y="192" text-anchor="middle" font-size="10.5" fill="#90a4ae" font-style="italic">no reads: no vote</text>

<!-- codon D: not lead (frame 1 wins) -->
<rect x="356" y="121" width="14" height="39" fill="#2a9d8f"/>
<rect x="373" y="108" width="14" height="52" fill="#9aa5b1"/>
<rect x="390" y="160" width="14" height="0" fill="#9aa5b1"/>
<text x="380" y="94" text-anchor="middle" font-size="13" fill="#90a4ae">–</text>
<text x="380" y="178" text-anchor="middle" font-size="11" fill="#78909c">4</text>

<!-- codon E: lead -->
<rect x="456" y="95" width="14" height="65" fill="#2a9d8f"/>
<rect x="473" y="134" width="14" height="26" fill="#9aa5b1"/>
<rect x="490" y="147" width="14" height="13" fill="#9aa5b1"/>
<text x="480" y="81" text-anchor="middle" font-size="13" fill="#2a9d8f">✓</text>
<text x="480" y="178" text-anchor="middle" font-size="11" fill="#78909c">5</text>

<!-- codon F: lead on 2 reads only - one vote, same as any other codon -->
<rect x="556" y="134" width="14" height="26" fill="#2a9d8f"/>
<rect x="573" y="147" width="14" height="13" fill="#9aa5b1"/>
<rect x="590" y="160" width="14" height="0" fill="#9aa5b1"/>
<text x="580" y="120" text-anchor="middle" font-size="13" fill="#2a9d8f">✓</text>
<text x="580" y="178" text-anchor="middle" font-size="11" fill="#78909c">6</text>

<!-- codon G: inside the host CDS, frame 1 bleed, not lead -->
<rect x="656" y="108" width="14" height="52" fill="#2a9d8f"/>
<rect x="673" y="95" width="14" height="65" fill="#9aa5b1"/>
<rect x="690" y="160" width="14" height="0" fill="#9aa5b1"/>
<text x="680" y="81" text-anchor="middle" font-size="13" fill="#90a4ae">–</text>
<text x="680" y="178" text-anchor="middle" font-size="11" fill="#78909c">7</text>

<text x="390" y="206" text-anchor="middle" font-size="12" fill="#263238">6 codons with reads vote (codon 3 has none): 4 lead, 2 do not.</text>
<text x="390" y="222" text-anchor="middle" font-size="10.5" fill="#78909c" font-style="italic">codon 7's null is not 1/3 here: the host CDS's own frame 1 bleeds into it.</text>
</svg>
