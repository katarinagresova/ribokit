<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 345" width="780" height="345" font-family="Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#263238">
<rect width="780" height="345" fill="white"/>

<!-- main transcript: leader / CDS / trailer -->
<line x1="260" y1="90" x2="260" y2="215" stroke="#b0bec5" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="600" y1="90" x2="600" y2="215" stroke="#b0bec5" stroke-width="1" stroke-dasharray="4,3"/>
<text x="150" y="82" text-anchor="middle" font-size="13" fill="#78909c">leader</text>
<text x="649" y="82" text-anchor="middle" font-size="13" fill="#78909c">trailer</text>
<text x="269" y="82" text-anchor="start" font-size="12" fill="#263238">start</text>
<text x="591" y="82" text-anchor="end" font-size="12" fill="#c0392b">stop</text>
<rect x="40" y="99" width="220" height="10" fill="#9aa5b1" rx="2"/>
<rect x="600" y="99" width="100" height="10" fill="#9aa5b1" rx="2"/>
<rect x="260" y="93" width="320" height="22" fill="#4c78a8" rx="2"/>
<rect x="260" y="93" width="20" height="22" fill="#2f5786"/>
<rect x="580" y="93" width="20" height="22" fill="#c0392b" rx="1"/>
<text x="420" y="108" text-anchor="middle" font-size="13" fill="white" font-weight="bold">CDS</text>

<!-- uORF: entirely in the leader -->
<rect x="100" y="140" width="80" height="18" fill="#2a9d8f" opacity="0.85" rx="2"/>
<rect x="100" y="140" width="20" height="18" fill="#1f6f63"/>
<text x="140" y="172" text-anchor="middle" font-size="12" fill="#2a9d8f" font-weight="bold">uORF</text>
<text x="140" y="186" text-anchor="middle" font-size="11" fill="#546e7a">ends at or before the CDS start</text>

<!-- uoORF: starts upstream, overlaps the CDS out of frame -->
<line x1="260" y1="88" x2="260" y2="93" stroke="#2f5786" stroke-width="2"/>
<line x1="280" y1="88" x2="280" y2="93" stroke="#2f5786" stroke-width="2"/>
<line x1="300" y1="88" x2="300" y2="93" stroke="#2f5786" stroke-width="2"/>
<line x1="320" y1="88" x2="320" y2="93" stroke="#2f5786" stroke-width="2"/>
<line x1="340" y1="88" x2="340" y2="93" stroke="#2f5786" stroke-width="2"/>
<line x1="267" y1="165" x2="267" y2="170" stroke="#b8472e" stroke-width="2"/>
<line x1="287" y1="165" x2="287" y2="170" stroke="#b8472e" stroke-width="2"/>
<line x1="307" y1="165" x2="307" y2="170" stroke="#b8472e" stroke-width="2"/>
<line x1="327" y1="165" x2="327" y2="170" stroke="#b8472e" stroke-width="2"/>
<rect x="220" y="170" width="120" height="18" fill="#e76f51" opacity="0.85" rx="2"/>
<rect x="220" y="170" width="20" height="18" fill="#b8472e"/>
<text x="280" y="202" text-anchor="middle" font-size="12" fill="#e76f51" font-weight="bold">uoORF</text>
<text x="280" y="216" text-anchor="middle" font-size="11" fill="#546e7a">starts upstream, out of frame with the CDS</text>
<text x="280" y="230" text-anchor="middle" font-size="10.5" fill="#90806f" font-style="italic">(codon ticks above/below the overlap don't line up)</text>

<!-- other: a transcript with no annotated CDS -->
<text x="550" y="247" text-anchor="middle" font-size="12" fill="#78909c">a transcript with no CDS: it is all one outside component</text>
<rect x="400" y="255" width="300" height="10" fill="#9aa5b1" rx="2"/>
<rect x="480" y="270" width="140" height="18" fill="#607d8b" opacity="0.85" rx="2"/>
<rect x="480" y="270" width="20" height="18" fill="#45545c"/>
<text x="550" y="302" text-anchor="middle" font-size="12" fill="#607d8b" font-weight="bold">other</text>
<text x="550" y="316" text-anchor="middle" font-size="11" fill="#546e7a">e.g. this ORF, or an in-frame extension of a CDS</text>

<!-- legend -->
<rect x="40" y="328" width="18" height="10" fill="#4c78a8" rx="2"/>
<text x="64" y="337" font-size="11" fill="#546e7a">CDS</text>
<rect x="110" y="328" width="18" height="10" fill="#2a9d8f" opacity="0.85" rx="2"/>
<text x="134" y="337" font-size="11" fill="#546e7a">uORF</text>
<rect x="190" y="328" width="18" height="10" fill="#e76f51" opacity="0.85" rx="2"/>
<text x="214" y="337" font-size="11" fill="#546e7a">uoORF</text>
<rect x="280" y="328" width="18" height="10" fill="#607d8b" opacity="0.85" rx="2"/>
<text x="304" y="337" font-size="11" fill="#546e7a">other</text>
<rect x="360" y="328" width="18" height="10" fill="#9aa5b1" rx="2"/>
<text x="384" y="337" font-size="11" fill="#546e7a">outside component (leader / trailer / transcript)</text>
</svg>
