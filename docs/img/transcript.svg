<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 364" width="780" height="364" font-family="Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#263238">
<rect width="780" height="364" fill="white"/>
<rect x="40" y="52" width="180" height="10" fill="#9aa5b1" stroke="none" rx="2" />
<rect x="618" y="52" width="122" height="10" fill="#9aa5b1" stroke="none" rx="2" />
<rect x="220" y="46" width="380" height="22" fill="#4c78a8" stroke="none" rx="2" />
